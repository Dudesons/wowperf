# Throughput cooldowns a player presses for a burst of output, by class and spec.
# No API exposes this list, so it is maintained by hand and dated.
#
# Throughput, not damage: a healing spec's cooldowns are here too, because
# "was it pressed on the pull that mattered" is the same question for a healer.
# Defensive cooldowns live in defensives.toml, and an ability must not appear in
# both files for the same spec -- several are genuinely dual-purpose, and the
# judgement of which file owns one is made here, once. A test enforces it.
#
# Only abilities on a cooldown of 45 seconds or longer are here. A shorter one is
# rotational, and a tool asking why it was not pressed on a particular pack would
# be asking about nothing.
#
# Cooldowns are base values, without talent reductions -- as in defensives.toml,
# and for the same reason. A longer cooldown makes an ability read as unavailable
# more often, and both claims built on this file are weaker for it, never louder.
#
# Every id and cooldown was read from the game's own spell data on the date below,
# one spell at a time, and the name returned had to match the ability intended.
# That check alone is not enough: the spell data still serves abilities removed
# from the game years ago, so availability was confirmed separately against live
# talent data and current spec guides. This pass dropped a dozen abilities that
# resolved perfectly and no longer exist.
