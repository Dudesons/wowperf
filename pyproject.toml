[project]
name = "wowperf"
version = "0.1.0"
description = "Analyse World of Warcraft logs and report what to improve"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
wowperf = "wowperf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowperf"]

[tool.hatch.build.targets.wheel.force-include]
"src/wowperf/adapters/render/report.html.j2" = "wowperf/adapters/render/report.html.j2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e' --strict-markers"
markers = [
    "e2e: hits the real Warcraft Logs API; needs credentials and spends quota",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer.Argument()/typer.Option() calls as parameter defaults are how typer
# declares CLI parameters; they are not the mutable-default bug B008 flags.
# Roles, Externals and SelfResurrections are Frozen (immutable) value objects;
# their empty defaults are the same shape of thing and carry no mutable state a
# call site could corrupt.
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "wowperf.domain.season.Externals",
    "wowperf.domain.season.Roles",
    "wowperf.domain.season.SelfResurrections",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
