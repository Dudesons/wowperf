# The gate from CLAUDE.md, run on every push and pull request. Until now the
# repository had no CI and no git hook, so the gate was whatever a person
# remembered to type.
#
# The end-to-end tests are not here and should not be: they hit the real
# Warcraft Logs API, need credentials, and spend an hourly quota of 3600 points
# shared with real work. `-m 'not e2e'` in pyproject.toml already excludes them,
# so `uv run pytest` is the offline suite and this workflow needs no secrets.
name: gate

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # A second push to the same branch makes the first run's answer worthless.
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to a full version on purpose: setup-uv published floating major
        # tags only through v7, so `@v10` resolves to nothing and the job dies at
        # "Set up job" before a single step runs.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        # --locked fails rather than re-resolving, so a pyproject.toml edited
        # without relocking is caught here instead of drifting quietly.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build the wheel and check it carries every template
        # None of the report's templates is a .py file, and every test runs from
        # the source tree, where they are present however the wheel is
        # configured. An installed wowperf missing one fails at the moment it
        # renders a report, so the wheel is opened here and its contents
        # compared against the render directory rather than a list kept by hand.
        run: |
          uv build --wheel --out-dir dist
          uv run python -c "
          import glob, pathlib, sys, zipfile
          wheel = sorted(glob.glob('dist/*.whl'))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          render = pathlib.Path('src/wowperf/adapters/render')
          assets = [p for p in sorted(render.iterdir()) if p.is_file() and p.suffix != '.py']
          if not assets:
              sys.exit(f'no templates found under {render}')
          missing = [str(p) for p in assets if p.relative_to('src').as_posix() not in names]
          if missing:
              sys.exit(f'{wheel} is missing {len(missing)}: ' + ', '.join(missing))
          print(f'{wheel} carries all {len(assets)} template files')
          "
